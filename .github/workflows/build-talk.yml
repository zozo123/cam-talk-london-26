name: Build Cambridge talk

on:
  push:
    branches: [main]
    paths:
      - "talk.tex"
      - "slides/**"
      - "Makefile"
      - ".github/workflows/build-talk.yml"
  pull_request:
    paths:
      - "talk.tex"
      - "slides/**"
      - "Makefile"
      - ".github/workflows/build-talk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Beamer PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: talk.tex
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: cambridge-forkable-sandboxes-talk
          path: talk.pdf
