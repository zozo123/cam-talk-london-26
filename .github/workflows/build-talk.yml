name: Build Cambridge talk

on:
  push:
    branches: [main]
    paths:
      - "talk.tex"
      - "preamble/**"
      - "acts/**"
      - "Makefile"
      - "tools/**"
      - ".github/workflows/build-talk.yml"
  pull_request:
    paths:
      - "talk.tex"
      - "preamble/**"
      - "acts/**"
      - "Makefile"
      - "tools/**"
      - ".github/workflows/build-talk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cambridge-talk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile canonical Cambridge deck
        uses: xu-cheng/latex-action@v3
        with:
          root_file: talk.tex

      - name: Verify canonical deck size and pacing
        shell: bash
        run: |
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader

          pages = PdfReader("talk.pdf").pages
          full = len(pages)
          print(f"Cambridge deck: {full} pages (41 story slides, no appendix)")
          if full != 41:
              raise SystemExit(f"ERROR: canonical Cambridge deck must be 41 pages; got {full}")
          # Guard against content accidentally consumed as a Beamer subtitle.
          anchors = {2: ["1,800", "56%"], 5: ["3:41", "20:01", "18:55"],
                     8: ["19,050", "120,000"], 9: ["Ori Chamo", "135,445"],
                     10: ["126", "0.969686"], 11: ["0.7%", "23%"],
                     12: ["AFL++", "1,000"], 13: ["1,748", "22"],
                     20: ["255/256", "6.87"], 33: ["0.0083", "0.177"]}
          for page, terms in anchors.items():
              rendered = pages[page].extract_text()
              for term in terms:
                  if term not in rendered:
                      raise SystemExit(f"Missing displayed content on page {page + 1}: {term}")
          PY
          python tools/presenter_guide.py --check
          git diff --exit-code PRESENTER-GUIDE.md

      - name: Upload the deck
        uses: actions/upload-artifact@v4
        with:
          name: cambridge-forkable-sandboxes
          path: talk.pdf

      - name: Publish the compiled deck to main
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A docs-only commit may land while TeX is compiling. Rebase first so
          # publishing generated PDFs is always a fast-forward update.
          git fetch origin main
          git rebase origin/main

          mkdir -p dist
          cp talk.pdf dist/forkable-sandboxes-cambridge.pdf
          git add dist/forkable-sandboxes-cambridge.pdf
          if git diff --cached --quiet; then
            echo "Compiled deck unchanged."
          else
            git commit -m "Publish compiled Cambridge talk PDF [skip ci]"
            git push origin HEAD:main
          fi
