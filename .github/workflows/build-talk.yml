name: Build Cambridge talk

on:
  push:
    branches: [main]
    paths:
      - "talk.tex"
      - "preamble/**"
      - "acts/**"
      - "assets/**"
      - "Makefile"
      - "tools/**"
      - ".github/workflows/build-talk.yml"
  pull_request:
    paths:
      - "talk.tex"
      - "preamble/**"
      - "acts/**"
      - "assets/**"
      - "Makefile"
      - "tools/**"
      - ".github/workflows/build-talk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cambridge-talk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile canonical Cambridge deck
        uses: xu-cheng/latex-action@v3
        with:
          root_file: talk.tex

      - name: Verify canonical deck size and pacing
        shell: bash
        run: |
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader

          pages = PdfReader("talk.pdf").pages
          full = len(pages)
          print(f"Cambridge deck: {full} pages (57 story slides, no appendix)")
          if full != 57:
              raise SystemExit(f"ERROR: canonical Cambridge deck must be 57 pages; got {full}")
          # Guard against content accidentally consumed as a Beamer subtitle.
          # Keys use the slide numbers shown to the audience.
          anchors = {
              2: ['Twistlock', 'Cytosim', 'Cancer-cell assays', '2010', '2016', '2025'],
              3: ['Twistlock', '1 hour'],
              4: ['Cytosim', '600 s', '30'],
              5: ['POSSUMM', '23 GB', '2.5 min', '4.6', 'including Eliaz'],
              6: ['14,000', 'DNA read files', 'Which data', 'Which software', 'Quality checks'],
              7: ['CRISPR', 'Choose edits', 'Test edits', 'Update', '118', '4 unintended'],
              8: ['Researchers chose a drug pair', 'Lab tests in mouse breast-cancer cells', 'Test 10 drugs', 'separately', 'Chemotherapy', 'Compare two effects', 'Cell killing', 'PD-L1 rise', 'Choose and test a pair', 'Abemaciclib', 'SI-2', '72-hour', '45 possible pairs', 'did not test all 45', 'CDK4/6', 'SRC-3', 'E0771'],
              9: ['300 million', 'Mobileye', '300M', 'speaker-reported', 'autonomous test vehicle (AV)', 'Manhattan', 'junction', 'Cars worldwide', 'anonymized road data', 'Match the same road', 'Combine repeated observations', 'HD Roadbook', 'back to cars', 'lanes, signs and driving paths', '34 billion', '1,080', 'road-miles/second', 'annual average'],
              10: ['Try action A', 'Advance the accepted state'],
              11: ['Python loop', 'Forkable API', 'checkpoint', 'evaluate', 'n=3'],
              12: ['46', '13', '3 s', '33 seconds', 'Restored cache', 'Hot cache', 'fresh runner'],
              13: ['sbx', 'Databricks'],
              14: ['microVM', 'cgroups', 'Firecracker'],
              16: ['Security and AI', 'Genomics and physics', 'software factory'],
              17: ['AFL++', 'controller', 'Target child', '1,000'],
              18: ['10', '20'],
              19: ['15.9%', '56%'],
              20: ['126', '0.969686'],
              21: ['0.7%'],
              22: ['19,050', '120,000', '6 guides per gene', '3 conditions', '3 repeat cultures', '9 pooled arms', '4 of 6 guides', 'DRACO', 'SI-12', '190-fold', '8 drug targets', '5 extra genes'],
              23: ['MCF-7', 'breast cancer', '10 of 13', '6 of 8', 'drug combinations'],
              24: ['Ori Chamo', '135,445', 'continuation', 'Li, Li', '2021', '2023', 'two plotted branches', 'Period', 'Angular', 'connects them'],
              25: ['26', '60-digit'],
              26: ['gain or lose stability', 'Stable:', 'Unstable:', 'small nudge', 'stays small', 'grows over time', 'becomes stable', 'becomes unstable', 'Change the masses', 'same orbit family', '60-digit', 'linear, planar'],
              27: ['feedback loop', 'Agent proposes', 'Tests exercise', 'Review inspects', 'serially'],
              28: ['Fan-out', 'Prepared state', 'Trial A', 'Trial B', 'Trial C', 'private'],
              29: ['Fan-in', 'Change A', 'Change B', 'Change C', 'Select one', 'compatible changes', 'final version'],
              30: ['state reuse', 'which files', 'what ran', 'Shared inputs', 'Coordinator', 'established tools'],
              31: ['retry', 'repaired code', 'Count job starts', 'Exactly one', 'targeted check'],
              32: ['Checked result', 'Save outside', 'Confirm', 'Delete', 'Publishing'],
              33: ['431', '1,748', '56 crashes', '22 distinct', 'Reproduce', 'duplicates'],
              34: ['Run', 'Gather evidence', 'Accept'],
              36: ['256 / 256', '3.44', '9.00'],
              37: ['Isorun', 'Miosa', 'Archil', '73 ms', '78 ms', '100 / 100', '2 October 2026'],
              38: ['setup', 'save', 'Start a run'],
              39: ['210', '34', '176', '14', '20'],
              40: ['bill', 'Model answers'],
              41: ['publish key', 'Controller'],
              42: ['Replacement starts', 'Late result', 'Reject', 'Scheduling assigns work'],
              43: ['reduce uncertainty', 'shared'],
              44: ['Select', 'Compose', 'Pool'],
              45: ['1 GB', '2 GB', '3 GB'],
              46: ['Union', '4 distinct', 'Intersection', '2 shared', 'New from B', '1 observation', 'Mutual information'],
              47: ['Split one dataset', 'Try different ideas', 'Edit different components', 'Repeat a measurement', 'Seek common findings', 'Union', 'Select', 'merge', 'Weighted average', 'Intersection', 'Argmax', 'ReLU', 'common score', 'shared error'],
              48: ['42', '43', 'Reject the duplicate'],
              49: ['covariance', 'weights', 'shared errors'],
              50: ['17.0004', '4.9566', 'precision'],
              51: ['9.17', '3.03', '0.33'],
              52: ['100 tasks', '50 tasks', '40 tasks', '80%', '40%'],
              53: ['receipt', '3 seconds', 'Code hash'],
              54: ['one dispatch', 'same files'],
              55: ['Model designs', 'Code edits', 'Measurements', 'Drug / orbit', 'Collection has not started'],
              56: ['Trial A', 'Trial B', 'Trial C', 'accepted result', 'controller'],
              57: ['46 s', '13 s', '33 s', '15.9%', '56%', '250', '3.5', '9.17', 'correlation 0.1'],
          }
          for slide, terms in anchors.items():
              rendered = " ".join(pages[slide - 1].extract_text().split()).casefold()
              for term in terms:
                  if term.casefold() not in rendered:
                      raise SystemExit(f"Missing displayed content on slide {slide}: {term}")
          PY
          python tools/presenter_guide.py --check
          git diff --exit-code PRESENTER-GUIDE.md

      - name: Upload the deck
        uses: actions/upload-artifact@v4
        with:
          name: cambridge-forkable-sandboxes
          path: talk.pdf

      - name: Publish the compiled deck to main
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A docs-only commit may land while TeX is compiling. Rebase first so
          # publishing generated PDFs is always a fast-forward update.
          git fetch origin main
          git rebase origin/main

          mkdir -p dist
          cp talk.pdf dist/forkable-sandboxes-cambridge.pdf
          git add dist/forkable-sandboxes-cambridge.pdf
          if git diff --cached --quiet; then
            echo "Compiled deck unchanged."
          else
            git commit -m "Publish compiled Cambridge talk PDF [skip ci]"
            git push origin HEAD:main
          fi
