name: Build Cambridge talk

on:
  push:
    branches: [main]
    paths:
      - "talk.tex"
      - "talk-30min.tex"
      - "academic/**"
      - "slides/**"
      - "Makefile"
      - ".github/workflows/build-talk.yml"
  pull_request:
    paths:
      - "talk.tex"
      - "talk-30min.tex"
      - "academic/**"
      - "slides/**"
      - "Makefile"
      - ".github/workflows/build-talk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile full academic Beamer PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: talk.tex
      - name: Compile concise 30-minute cut
        uses: xu-cheng/latex-action@v3
        with:
          root_file: talk-30min.tex
      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: cambridge-forkable-sandboxes-talks
          path: |
            talk.pdf
            talk-30min.pdf
      - name: Publish compiled PDFs to main
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p dist
          cp talk.pdf dist/forkable-sandboxes-full-academic.pdf
          cp talk-30min.pdf dist/forkable-sandboxes-30min.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/forkable-sandboxes-full-academic.pdf dist/forkable-sandboxes-30min.pdf
          if git diff --cached --quiet; then
            echo "Compiled PDFs unchanged."
          else
            git commit -m "Publish compiled Cambridge talk PDFs [skip ci]"
            git push origin HEAD:main
          fi
