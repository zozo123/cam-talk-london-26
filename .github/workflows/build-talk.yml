name: Build Cambridge talk

on:
  push:
    branches: [main]
    paths:
      - "talk.tex"
      - "preamble/**"
      - "acts/**"
      - "Makefile"
      - "tools/**"
      - ".github/workflows/build-talk.yml"
  pull_request:
    paths:
      - "talk.tex"
      - "preamble/**"
      - "acts/**"
      - "Makefile"
      - "tools/**"
      - ".github/workflows/build-talk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cambridge-talk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile canonical Cambridge deck
        uses: xu-cheng/latex-action@v3
        with:
          root_file: talk.tex

      - name: Verify canonical deck size and pacing
        shell: bash
        run: |
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader

          pages = PdfReader("talk.pdf").pages
          full = len(pages)
          print(f"Cambridge deck: {full} pages (50 story slides, no appendix)")
          if full != 50:
              raise SystemExit(f"ERROR: canonical Cambridge deck must be 50 pages; got {full}")
          # Guard against content accidentally consumed as a Beamer subtitle.
          anchors = {
              1: ['Twistlock', 'Cytosim', 'Immunotherapy'],
              2: ['Twistlock', '1 hour'],
              3: ['Cytosim', '600 s', '30'],
              4: ['POSSUMM', '23 GB', '2.5 min', '4.6'],
              5: ['14,000', 'Cromwell'],
              6: ['CRISPR-IL', 'GoGenome'],
              7: ['PD-L1', 'Abemaciclib', 'SI-2', '72'],
              9: ['Try action A', 'Advance the accepted state'],
              10: ['Python loop', 'Forkable API', 'checkpoint', 'evaluate', 'n=3'],
              11: ['46', '13', '3 s'],
              12: ['sbx', 'Databricks'],
              13: ['microVM', 'cgroups', 'Firecracker'],
              15: ['AFL++', '1,000'],
              17: ['15.9%', '56%'],
              18: ['126', '0.969686'],
              19: ['0.7%'],
              20: ['19,050', '120,000'],
              22: ['Ori Chamo', '135,445'],
              23: ['26', '60-digit'],
              24: ['releases.astral.sh', 'githubusercontent.com'],
              25: ['43:44', '3:41', '20:01', '18:55', '10.33'],
              26: ['59%', '75%'],
              28: ['1,972'],
              30: ['1,748', '22'],
              31: ['Run', 'Evidence', 'Accept'],
              33: ['256 / 256', '3.44', '9.00'],
              39: ['Runtime', 'Evidence', 'Acceptance'],
              43: ['17.0004', '4.9566'],
              44: ['9.17'],
              47: ['one dispatch'],
              48: ['Not yet run', '98.3', '0.05'],
              49: ['Self-driving computers', 'acceptance boundary'],
          }
          for page, terms in anchors.items():
              rendered = pages[page].extract_text()
              for term in terms:
                  if term not in rendered:
                      raise SystemExit(f"Missing displayed content on page {page + 1}: {term}")
          PY
          python tools/presenter_guide.py --check
          git diff --exit-code PRESENTER-GUIDE.md

      - name: Upload the deck
        uses: actions/upload-artifact@v4
        with:
          name: cambridge-forkable-sandboxes
          path: talk.pdf

      - name: Publish the compiled deck to main
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A docs-only commit may land while TeX is compiling. Rebase first so
          # publishing generated PDFs is always a fast-forward update.
          git fetch origin main
          git rebase origin/main

          mkdir -p dist
          cp talk.pdf dist/forkable-sandboxes-cambridge.pdf
          git add dist/forkable-sandboxes-cambridge.pdf
          if git diff --cached --quiet; then
            echo "Compiled deck unchanged."
          else
            git commit -m "Publish compiled Cambridge talk PDF [skip ci]"
            git push origin HEAD:main
          fi
