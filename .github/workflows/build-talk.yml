name: Build Cambridge talk

on:
  push:
    branches: [main]
    paths:
      - "talk.tex"
      - "talk-30min.tex"
      - "academic/**"
      - "slides/**"
      - "Makefile"
      - "tools/**"
      - ".github/workflows/build-talk.yml"
  pull_request:
    paths:
      - "talk.tex"
      - "talk-30min.tex"
      - "academic/**"
      - "slides/**"
      - "Makefile"
      - "tools/**"
      - ".github/workflows/build-talk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cambridge-talk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile canonical 40-slide Cambridge deck
        uses: xu-cheng/latex-action@v3
        with:
          root_file: talk.tex

      - name: Compile 30-minute fallback cut
        uses: xu-cheng/latex-action@v3
        with:
          root_file: talk-30min.tex

      - name: Verify canonical deck size and pacing
        shell: bash
        run: |
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader

          full = len(PdfReader("talk.pdf").pages)
          short = len(PdfReader("talk-30min.pdf").pages)
          print(f"Cambridge deck: {full} pages (31 main + backups)")
          print(f"30-minute historical cut: {short} slides")
          if full != 44:
              raise SystemExit(f"ERROR: canonical Cambridge deck must be 44 pages; got {full}")
          PY
          python tools/presenter_guide.py --check
          git diff --exit-code PRESENTER-GUIDE.md

      - name: Upload both PDFs
        uses: actions/upload-artifact@v4
        with:
          name: cambridge-forkable-sandboxes-talks
          path: |
            talk.pdf
            talk-30min.pdf

      - name: Publish compiled PDFs to main
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A docs-only commit may land while TeX is compiling. Rebase first so
          # publishing generated PDFs is always a fast-forward update.
          git fetch origin main
          git rebase origin/main

          mkdir -p dist
          cp talk.pdf dist/forkable-sandboxes-cambridge-40.pdf
          cp talk-30min.pdf dist/forkable-sandboxes-30min.pdf
          git add dist/forkable-sandboxes-cambridge-40.pdf dist/forkable-sandboxes-30min.pdf
          if git diff --cached --quiet; then
            echo "Compiled PDFs unchanged."
          else
            git commit -m "Publish compiled Cambridge talk PDFs [skip ci]"
            git push origin HEAD:main
          fi
