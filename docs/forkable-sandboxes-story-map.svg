<text x="43.00" y="375.00" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#173347">AI experiments</text>
<text x="43.00" y="400.00" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#007D82">126 attempts / 23 kept</text>
<text x="43.00" y="427.00" font-family="Arial, sans-serif" font-size="10.1" font-weight="400" fill="#173347">Autoresearch: sequential search, 5 min TRAIN per attempt.</text>
<text x="43.00" y="443.10" font-family="Arial, sans-serif" font-size="10.1" font-weight="400" fill="#173347">Validation bits per byte: 0.997900 → 0.969686.</text>
<text x="43.00" y="459.20" font-family="Arial, sans-serif" font-size="10.1" font-weight="400" fill="#173347">AlphaEvolve: 0.7% of Google compute capacity recovered through</text>
<text x="43.00" y="472.30" font-family="Arial, sans-serif" font-size="10.1" font-weight="400" fill="#173347">algorithm search.</text>
<text x="43.00" y="521.00" font-family="Arial, sans-serif" font-size="8.6" font-weight="400" fill="#007D82">Program</text>
<a href="https://github.com/karpathy/autoresearch/blob/master/program.md"><rect x="43.00" y="511.40" width="32.98" height="11.60" fill="transparent"/></a>
<text x="87.98" y="521.00" font-family="Arial, sans-serif" font-size="8.6" font-weight="400" fill="#007D82">Run</text>
