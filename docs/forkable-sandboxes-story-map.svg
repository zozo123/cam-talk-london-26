<text x="43.00" y="173.00" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#173347">Software factory</text>
<text x="43.00" y="198.00" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#007D82">43:44 / $10.33</text>
<text x="43.00" y="224.00" font-family="Arial, sans-serif" font-size="10.1" font-weight="400" fill="#173347">Two redirect hosts; six-file allowlist plan.</text>
<text x="43.00" y="240.10" font-family="Arial, sans-serif" font-size="10.1" font-weight="400" fill="#173347">Airflow + Docker Sandboxes; model through</text>
<text x="43.00" y="253.20" font-family="Arial, sans-serif" font-size="10.1" font-weight="400" fill="#173347">Databricks.</text>
<text x="43.00" y="269.30" font-family="Arial, sans-serif" font-size="10.1" font-weight="400" fill="#173347">Suite and review ran; the direct adoption test</text>
<text x="43.00" y="282.40" font-family="Arial, sans-serif" font-size="10.1" font-weight="400" fill="#173347">remained absent.</text>
