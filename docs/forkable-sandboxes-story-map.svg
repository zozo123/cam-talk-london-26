<text x="291.67" y="173.00" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#173347">Genomics assays</text>
<text x="291.67" y="198.00" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#007D82">6 of 8 combinations</text>
<text x="291.67" y="224.00" font-family="Arial, sans-serif" font-size="10.1" font-weight="400" fill="#173347">MCF-7 assays: greater killing with SRC-3</text>
<text x="291.67" y="237.10" font-family="Arial, sans-serif" font-size="10.1" font-weight="400" fill="#173347">inhibitor SI-12.</text>
<text x="291.67" y="253.20" font-family="Arial, sans-serif" font-size="10.1" font-weight="400" fill="#173347">Input: &gt;120,000 guides; 19,050 genes. Rank,</text>
<text x="291.67" y="266.30" font-family="Arial, sans-serif" font-size="10.1" font-weight="400" fill="#173347">then assay.</text>
<text x="291.67" y="282.40" font-family="Arial, sans-serif" font-size="10.1" font-weight="400" fill="#173347">Wet-lab replication; source identity.</text>
<text x="291.67" y="330.00" font-family="Arial, sans-serif" font-size="8.6" font-weight="400" fill="#007D82">Paper and methods</text>
<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7994904/"><rect x="291.67" y="320.40" width="75.06" height="11.60" fill="transparent"/></a>
