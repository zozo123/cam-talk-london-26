<text x="416.00" y="375.00" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#173347">Security campaigns</text>
<text x="416.00" y="400.00" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#007D82">AFL++ persistent: 10-20x</text>
<text x="416.00" y="426.00" font-family="Arial, sans-serif" font-size="10.1" font-weight="400" fill="#173347">1,000-input worker loop with per-input reset.</text>
<text x="416.00" y="442.10" font-family="Arial, sans-serif" font-size="10.1" font-weight="400" fill="#173347">CyberGym / OpenHands + GPT-5: 431 projects; 1,748 executables.</text>
<text x="416.00" y="458.20" font-family="Arial, sans-serif" font-size="10.1" font-weight="400" fill="#173347">56 candidate crashes; 22 confirmed zero-days.</text>
<text x="416.00" y="474.30" font-family="Arial, sans-serif" font-size="10.1" font-weight="400" fill="#173347">Persistent mode reuses process state; the campaign tests vulnerability</text>
<text x="416.00" y="487.40" font-family="Arial, sans-serif" font-size="10.1" font-weight="400" fill="#173347">outcomes.</text>
<text x="416.00" y="521.00" font-family="Arial, sans-serif" font-size="8.6" font-weight="400" fill="#007D82">AFL++</text>
<a href="https://github.com/AFLplusplus/AFLplusplus/blob/stable/instrumentation/README.persistent_mode.md"><rect x="416.00" y="511.40" width="25.82" height="11.60" fill="transparent"/></a>
<text x="453.82" y="521.00" font-family="Arial, sans-serif" font-size="8.6" font-weight="400" fill="#007D82">CyberGym</text>
<a href="https://rdi.berkeley.edu/blog/cybergym/"><rect x="453.82" y="511.40" width="41.09" height="11.60" fill="transparent"/></a>
<text x="30.00" y="558.00" font-family="Arial, sans-serif" font-size="8.8" font-weight="700" fill="#936923">EXECUTION DESIGN</text>
<text x="135.00" y="558.00" font-family="Arial, sans-serif" font-size="10.2" font-weight="400" fill="#173347">Worktrees for source; checkpoints for live state; persistent process reset for repeated inputs.</text>
<text x="30.00" y="582.00" font-family="Arial, sans-serif" font-size="9.4" font-weight="400" fill="#556976">Domain-specific outcomes retain their evaluation unit. Choose execution reuse to match the state required.</text>
<text x="30.00" y="596.00" font-family="Arial, sans-serif" font-size="8.6" font-weight="400" fill="#556976">Yossi Eliaz  •  Cambridge SRG  •  Source links appear inside each case.</text>
